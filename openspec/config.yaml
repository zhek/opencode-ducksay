schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  Язык документации:
  - Артефакты OpenSpec (proposal, design, specs, tasks) пишутся на русском языке.
  - Проектная документация (README.md, CHANGELOG.md, справка по конфигурации и опциям)
    ведется на английском языке. Русская версия README поддерживается в README.ru.md
    и обновляется вместе с README.md.
  - Код, идентификаторы и имена файлов — на английском языке.
  Documentation language: OpenSpec artifacts in Russian; project docs (README.md,
  CHANGELOG.md, config/options reference) in English, with README.ru.md kept in sync.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  tasks:
    - "Для каждой задачи на новый функционал или исправление бага в этом же tasks.md должна быть отдельная задача на написание автотестов — задача на реализацию без задачи на тесты не считается выполненной."
    - "Тест на исправление бага должен воспроизводить исходный дефект: падать до исправления и проходить после. Тест, который проходит и с дефектом, не защищает от регрессии."
    - "Каждый tasks.md обязан содержать две обязательные задачи в конце списка, независимо от того, какие задачи требует сама задача."
    - "Обязательная задача 1 — «Запустить автоматизированные тесты» — выполнить bun test и bunx tsc --noEmit и убедиться, что все проверки проходят. Тесты отрисовки (testRender, captureCharFrame из @opentui/solid) требуют Bun: под Node они не запускаются в принципе, потому что опираются на нативные модули OpenTUI."
    - "Обязательная задача 2 — «Обновить проектную документацию» — перечислить конкретные изменяемые документы (README.md, README.ru.md, справка по конфигурации и опциям) и, если изменение видно пользователю, добавить запись в раздел `## Unreleased` файла `CHANGELOG.md`. Документация — часть задачи, а не отдельная работа «на потом». Любое изменение README.md дублируется в README.ru.md в рамках той же задачи. Версию эта задача не двигает: bump делает отдельный релизный PR с ветки `chore/release-<версия>`."
    - "Именование веток: ветка нового функционала создаётся от main с именем feat/<имя-change> и совпадает с директорией openspec/changes/<имя-change>/ за префиксом, чтобы --change <имя> передавался в команды OpenSpec без правок. Работа, которая не оформлена как change, идёт на ветке chore/<slug> или fix/<slug>."
    - "Обычный PR версию пакета не двигает. Пользовательски значимое изменение попадает в `CHANGELOG.md` в раздел `## Unreleased` в начале файла, под теми же подзаголовками, что и у выпущенных записей: `### Added`, `### Changed`, `### Fixed`, `### Removed`. Такой PR не создаёт заголовок `## [X.Y.Z]`, не добавляет ссылку релиза и не трогает `version` в `package.json`. Раздел `## Unreleased` заводит первый PR, которому есть что в него положить. Изменение без видимого пользователю эффекта (`chore`, `docs`, `refactor`, работа над тестами) `CHANGELOG.md` не трогает вовсе."
    - "Версию двигает только PR, идущий с ветки `chore/release-<версия>`, и все её следы меняются в нём же и в том же коммите: `## Unreleased` переименовывается в `## [X.Y.Z] — дата` с датой этого дня, в конец файла добавляется ссылка `[X.Y.Z]: .../releases/tag/vX.Y.Z`, `version` в `package.json` становится X.Y.Z. Новый функционал поднимает минорную часть, исправление — патчевую. Такой PR не является change, поэтому артефактов OpenSpec не несёт. Префикс у него общий с прочей рутиной: `chore` в имени ветки — разрешённый префикс, `release-<версия>` — свободный slug, и коммит тоже `chore: release <версия>`. Собственного типа `release` в проекте нет, и вводить его незачем: при squash-merge заголовок PR становится коммитом в `main`, поэтому тип из соглашения надёжнее красивого слова. Признак релизного PR — имя ветки: метки GitHub в проекте нет, и по файлам её не проверить. Если релизный PR переносит не всё накопленное в `Unreleased`, остаток молча уедет в следующий релиз."
    - "CHANGELOG.md и README описывают сторону пользователя: что изменилось в поведении, что стало настраиваемым, что перестало работать. Тонкости реализации — имена функций и модулей, устройство алгоритмов, зеркалирование спрайтов, события хоста — в пользовательскую документацию не попадают, им место в design.md. Проверка простая: если строку нельзя подтвердить, не открыв исходники, это не описание для пользователя."
    - "Нормативные ключевые слова в specs пишутся по-английски даже в русскоязычных артефактах: каждое требование должно содержать SHALL или MUST в своём теле — между заголовком ### Requirement и первым #### Scenario, а не в самом заголовке и не в сценариях. Валидатор ищет литеральную строку SHALL или MUST регуляркой \\b(SHALL|MUST)\\b, поэтому русские эквиваленты («должна», «должен») не подходят. Без этого openspec validate --strict <имя> завершается с ошибкой и блокирует архивацию."

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - "Каждый новый функционал и каждое исправление бага в этом change реализуется вместе с автотестом — задача без теста не считается выполненной."
      - "Тест на исправление бага сначала должен воспроизводить дефект (падать), и только после исправления проходить. Написать тест по post-mortem описанию недостаточно."
      - "Перед тем как отметить задачу выполненной, запусти bun test и bunx tsc --noEmit. Раннер — Bun, а не Node: тесты отрисовки (testRender, captureCharFrame из @opentui/solid) опираются на нативные модули OpenTUI и под node --test не запускаются."
      - "README.md и README.ru.md обновляются в одной и той же задаче; расхождение версий недопустимо."
      - "Обычный PR версию пакета не двигает: пользовательски значимое изменение добавляется в раздел `## Unreleased` файла `CHANGELOG.md` под теми же подзаголовками, что и у выпущенных записей, а `version` в `package.json`, заголовки `## [X.Y.Z]` и ссылки релиза остаются нетронутыми. Изменение без видимого пользователю эффекта `CHANGELOG.md` не трогает. Перед тем как отметить задачу на документацию выполненной, сверь, что в `CHANGELOG.md` появилась запись в `Unreleased` и что версия в `package.json` не тронута."
      - "Версию двигает только PR, идущий с ветки `chore/release-<версия>`: он переименовывает `## Unreleased` в `## [X.Y.Z] — дата`, добавляет ссылку `[X.Y.Z]: .../releases/tag/vX.Y.Z`, ставит `version` в `package.json` и переносит всё накопленное в `Unreleased`; недобранный остаток уедет в следующий релиз. Новый функционал поднимает минорную часть, исправление — патчевую. Такой PR — не change, поэтому идёт без артефактов OpenSpec, под общим для рутины префиксом `chore`: ветка `chore/release-<версия>`, коммит `chore: release <версия>`."
      - "CHANGELOG.md и README описывают сторону пользователя: что изменилось в поведении, что стало настраиваемым, что перестало работать. Тонкости реализации — имена функций и модулей, устройство алгоритмов, зеркалирование спрайтов, события хоста — в пользовательскую документацию не попадают, им место в design.md. Проверка простая: если строку нельзя подтвердить, не открыв исходники, это не описание для пользователя."
      - "Задачи «Запустить автоматизированные тесты» и «Обновить проектную документацию» выполняются последними и тоже отмечаются выполненными."
      - "Создание и изменение спеки change (delta spec в `openspec/changes/<имя-change>/specs/`) коммитится с префиксом `docs:` — например, `docs: add <имя-change> spec` или `docs: update <имя-change> spec` — и не смешивается с коммитами реализации."
      - "Ветка нового функционала создаётся от main с именем feat/<имя-change> и совпадает с директорией openspec/changes/<имя-change>/ за префиксом, чтобы --change <имя> передавался в команды OpenSpec без правок. Работа, которая не оформлена как change, идёт на ветке chore/<slug> или fix/<slug>."
      - "Нормативные ключевые слова в specs пишутся по-английски даже в русскоязычных артефактах: каждое требование должно содержать SHALL или MUST в своём теле — между заголовком ### Requirement и первым #### Scenario, а не в самом заголовке и не в сценариях. Валидатор ищет литеральную строку SHALL или MUST регуляркой \\b(SHALL|MUST)\\b, поэтому русские эквиваленты («должна», «должен») не подходят. Без этого openspec validate --strict <имя> завершается с ошибкой и блокирует архивацию."
  archive:
    guidance:
      - "Архивируй change до мержа: создание главной спеки и перенос change в archive/ делаются в том же PR, что и код, последним коммитом — чтобы main после мержа сразу был консистентным, без активных change и без capability, которой нет в openspec/specs/."
      - "Перед архивацией убедись, что openspec validate --strict <имя> проходит и все чекбоксы в tasks.md отмечены."
      - "Коммит архивации — `docs:` на английском в формате Conventional Commits: `docs: archive <имя-change>`."
# Example for archive:
#   archive:
#     guidance:
#       - Summarize the archive outcome before finishing
